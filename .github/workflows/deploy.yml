name: Deploy to GitHub Pages

# Además de cada push, se ejecuta cada 15 min para refrescar los focos de calor
# (NASA FIRMS + MINAM) sin commitear: los datos de incendios viajan solo en el
# artefacto de Pages. Ver docs/INCENDIOS.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # nunca cortar una ingesta a medias; las siguientes esperan

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # este job no hace push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Recuperar la última versión publicada de incendios
        # Conserva fechas de recepción, la serie diaria acumulada y el último dato
        # válido de cada fuente. Solo reemplaza la copia del repo si el JSON es válido.
        run: |
          SITE="https://unimauro.github.io/observatorio-ambiental-peruano/data"
          for f in incendios/estado.json incendios/focos.json incendios/serie-diaria.json \
                   incendios/minam-2026.geojson incendios/minam-resumen.json; do
            if curl -fsS --max-time 60 "$SITE/$f" -o /tmp/prev.json \
               && python -c "import json,sys; json.load(open('/tmp/prev.json'))"; then
              mv /tmp/prev.json "public/data/$f"; echo "recuperado $f"
            else
              echo "::notice::sin versión publicada válida de $f; se usa la del repo"
            fi
          done

      - name: Ingesta de incendios (NASA FIRMS + MINAM)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          INCENDIOS_DIAS: ${{ vars.INCENDIOS_DIAS || '7' }}
          INCENDIOS_ALCANCE: ${{ vars.INCENDIOS_ALCANCE || 'peru' }}
        # 0 = ok · 3 = todas las fuentes satelitales cayeron (se publica la última versión válida)
        # otro código = error del propio ETL → el job falla y Pages conserva el despliegue anterior
        run: |
          set +e
          python etl/build_incendios.py; rc=$?
          if [ "$rc" = 3 ]; then echo "::warning::Todas las fuentes satelitales fallaron; se publica la última versión válida"
          elif [ "$rc" != 0 ]; then echo "::error::El ETL de incendios terminó con código $rc"; exit "$rc"; fi

      - name: Pruebas
        if: github.event_name != 'schedule'
        run: |
          npm ci
          npm test

      - run: npm ci
        if: github.event_name == 'schedule'
      - run: npm run build

      - name: Verificar que no se publiquen secretos
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -n "$FIRMS_MAP_KEY" ] && grep -rqF -- "$FIRMS_MAP_KEY" dist; then
            echo "::error::La MAP_KEY aparece en dist/"; exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
